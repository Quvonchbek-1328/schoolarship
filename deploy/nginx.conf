# Grant Atlas — static site. Copy to /etc/nginx/conf.d/grant-atlas.conf and set server_name / root.
server {
    listen 80;
    server_name example.uz;                 # o'z domeningiz
    root /var/www/grant-atlas;              # public/ papkasi shu yerga ko'chiriladi
    index index.html;

    # index.html and the JSON data are large (7 MB each): compress them
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html application/json text/css application/javascript;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.json$    { add_header Cache-Control "public, max-age=3600"; }
    location ~* \.xlsx$    { add_header Content-Disposition "attachment"; }

    location / { try_files $uri $uri/ /index.html; }
}
